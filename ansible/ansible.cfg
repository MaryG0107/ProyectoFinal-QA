# =============================================================
# FlashStore - configuración de Ansible
# Ejecutar SIEMPRE desde la carpeta ansible/:
#   cd ansible && ansible-playbook playbooks/site.yml
# =============================================================
[defaults]
inventory = inventory/gcp.ini
roles_path = roles
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
timeout = 30

[ssh_connection]
# La VM se recrea con otra llave de host después de cada "terraform destroy",
# por eso se usa un known_hosts propio que scripts/gcp-down.sh borra.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_flashstore_gcp
pipelining = True
