---
- name: Zona horaria actual
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: base_current_tz
  changed_when: false

- name: Zona horaria del servidor
  ansible.builtin.command: "timedatectl set-timezone {{ base_timezone }}"
  when: base_current_tz.stdout != base_timezone
  changed_when: true

- name: Actualizar índice de paquetes (espera si unattended-upgrades tiene el candado)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Paquetes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - jq
      - python3-debian   # lo necesita deb822_repository (rol docker)
    state: present
    lock_timeout: 600

- name: ¿Ya existe el archivo swap?
  ansible.builtin.stat:
    path: "{{ base_swap_file }}"
  register: base_swap_stat

- name: Crear archivo swap
  ansible.builtin.command: "fallocate -l {{ base_swap_size_mb }}M {{ base_swap_file }}"
  when: not base_swap_stat.stat.exists
  changed_when: true

- name: Permisos del swap
  ansible.builtin.file:
    path: "{{ base_swap_file }}"
    mode: "0600"
    owner: root
    group: root

- name: Formatear swap
  ansible.builtin.command: "mkswap {{ base_swap_file }}"
  when: not base_swap_stat.stat.exists
  changed_when: true

- name: Activar swap
  ansible.builtin.command: "swapon {{ base_swap_file }}"
  when: not base_swap_stat.stat.exists
  changed_when: true

- name: Swap persistente en /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ base_swap_file }} none swap sw 0 0"
    state: present
