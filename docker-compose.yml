# =============================================================
# FlashStore - Ambiente local / QA
# Uso:  cp .env.example .env   (y cambiar las claves)
#       docker compose up -d --build
#
# Puertos elegidos para NO chocar con lo que ya corre en la VM:
#   Jenkins 8080, SonarQube 9000, Dependency-Track 8081/8082
# PWA: http://localhost:3000   API/Swagger: http://localhost:5000/swagger
# =============================================================

name: flashstore

services:
  postgres:
    image: postgres:16-alpine
    container_name: flashstore-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashstore}
      POSTGRES_USER: ${POSTGRES_USER:-flashstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashstore} -d ${POSTGRES_DB:-flashstore}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: flashstore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flashstore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-flashstore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Consola web de administración
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/src/FlashStore.Api/Dockerfile
    image: flashstore-api:local
    container_name: flashstore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flashstore};Username=${POSTGRES_USER:-flashstore};Password=${POSTGRES_PASSWORD};Maximum Pool Size=120"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-flashstore}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY en .env}
      Inventory__Strategy: ${INVENTORY_STRATEGY:-Atomic}
      RateLimit__LoginPermitPerMinute: ${LOGIN_RATE_LIMIT:-10}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:8080"

  worker:
    build:
      context: .
      dockerfile: backend/src/FlashStore.Worker/Dockerfile
    image: flashstore-worker:local
    container_name: flashstore-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flashstore};Username=${POSTGRES_USER:-flashstore};Password=${POSTGRES_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-flashstore}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Worker__SimulateFailureQueue: ${SIMULATE_CONSUMER_FAILURE:-}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: flashstore-web:local
    container_name: flashstore-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:8080"   # PWA (web, desktop y móvil) + proxy /api

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
