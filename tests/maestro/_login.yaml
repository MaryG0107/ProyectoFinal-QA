# Subflujo reutilizable: inicia sesión con el cliente de prueba cliente20
url: ${BASE_URL}
env:
  BASE_URL: http://localhost:3000
---
- launchApp:
    clearState: true
- tapOn: "Ingresar"
- assertVisible: "Iniciar sesión"
- tapOn:
    css: "[data-testid='login-email']"
- inputText: "cliente20@flashstore.test"
- tapOn:
    css: "[data-testid='login-password']"
- inputText: "Test1234!"
- tapOn:
    css: "[data-testid='login-submit']"
- extendedWaitUntil:
    visible: "Mis pedidos"
    timeout: 15000